# UrbanComp Ink owned service v1
description "UrbanComp native research screen"

start on framework_ready
stop on stopping framework or stopping filesystems_userstore

# A failure returns to the Kindle UI; never enter a respawn loop.
kill timeout 25

script
    D=/mnt/us/urbancomp-ink
    R=/tmp/urbancomp-ink-runtime
    exec >/tmp/urbancomp-ink-bootstrap.log 2>&1
    date '+BOOTSTRAP %Y-%m-%d %H:%M:%S'
    [ -f "$D/ENABLED" ] && [ ! -f "$D/DISABLED" ] || exit 0
    drive=$(timeout -t 3 lipc-get-prop com.lab126.volumd driveModeState)
    available=$(timeout -t 3 lipc-get-prop com.lab126.volumd userstoreIsAvailable)
    echo "STORAGE drive=$drive available=$available"
    [ "$drive" = 0 ] && [ "$available" = 1 ] || exit 0
    cd "$D" || exit 1
    sha256sum -c SHA256SUMS >/tmp/urbancomp-ink-checksums.log 2>&1 || exit 1
    mkdir -p "$R"
    cp "$D/system/run.sh" "$R/run.sh" || exit 1
    cp "$D/system/restore.sh" "$R/restore.sh" || exit 1
    exec /bin/sh "$R/run.sh"
end script

post-stop script
    [ ! -f /tmp/urbancomp-ink-runtime/restore.sh ] || /bin/sh /tmp/urbancomp-ink-runtime/restore.sh
end script
